[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "luminal_python"
version = "0.1.0"
description = "Python bindings for Luminal deep learning compiler"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
dependencies = [
    "onnx",
    "onnxscript",
    "torch",
    "numpy",
]

[tool.maturin]
features = ["extension-module"]
module-name = "luminal_python.luminal_python"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
